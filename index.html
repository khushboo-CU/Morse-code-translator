<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Morse Code Translator</h1>

        <textarea
            id="inputText"
            placeholder="Enter text or Morse code..."
        ></textarea>

        <div class="buttons">
            <button onclick="textToMorse()">
                Text ➜ Morse
            </button>

            <button onclick="morseToText()">
                Morse ➜ Text
            </button>

            <button onclick="copyResult()">
                Copy
            </button>

            <button onclick="clearAll()">
                Clear
            </button>
        </div>

        <textarea
            id="outputText"
            placeholder="Result..."
            readonly
        ></textarea>

    </div>
    <p>THANKS</p>

    <script src="script.js"></script>

</body>
</html>
